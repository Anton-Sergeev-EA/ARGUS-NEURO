version: 2
updates:
  # Python packages are pinned on purpose: numpy, pandas and scikit-learn
  # versions change the trained models and golden results, so they are
  # upgraded by hand together with retraining (see SECURITY.md).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
