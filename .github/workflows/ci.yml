name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r python/requirements-dev.txt
      - name: Python lint and formatting
        run: |
          ruff check python
          ruff format --check python
      - name: Release build (warnings are errors) and CTest
        run: |
          ARGUS_CMAKE_ARGS="-DARGUS_WERROR=ON" bash scripts/build_cpp_core.sh
          ctest --test-dir build --output-on-failure
      - name: Static analysis of the native core
        run: |
          sudo apt-get install -y --no-install-recommends clang-tidy
          clang-tidy -p build cpp_core/src/*.cpp --quiet
      - name: Documentation stays consistent
        run: python scripts/check_docs.py
      - name: Native Python contracts
        run: |
          export PYTHONPATH="${PWD}/python:${PWD}/build/cpp_core"
          python -c "from argus.features import using_native_core; assert using_native_core()"
          python -m pytest python/tests -q --cov=argus --cov-report=term-missing --cov-fail-under=70
      - name: NumPy fallback contracts
        run: |
          export PYTHONPATH="${PWD}/python"
          python -c "from argus.features import using_native_core; assert not using_native_core()"
          python -m pytest python/tests -q
      - name: Dashboard contracts
        run: |
          node --check web/dashboard/app.js
          node --test web/dashboard/tests/*.test.cjs
      - name: Validate staged training and ONNX parity
        run: bash scripts/train_all.sh
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (builds the C++ core and runs its tests)
        run: docker compose build
      - name: Start, train the equipment models and restart
        run: |
          docker compose up -d
          docker compose exec -T argus bash scripts/train_all.sh
          docker compose restart argus
      - name: Smoke test of the running container
        run: |
          bash scripts/docker_smoke.sh
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"model_backed":true'
      - name: Stop the development stack
        run: docker compose down -v
      - name: Production stack, TLS and login
        run: |
          PASSWORD="$(head -c 18 /dev/urandom | base64 | tr -d '/+=')"
          echo "::add-mask::$PASSWORD"
          HASH="$(docker run --rm caddy:2.11.7-alpine caddy hash-password --plaintext "$PASSWORD" | sed 's/\$/$$/g')"
          {
            echo "ARGUS_USER=operator"
            echo "ARGUS_PASSWORD_HASH=$HASH"
            echo "ARGUS_HTTP_PORT=8080"
            echo "ARGUS_HTTPS_PORT=8443"
          } > prod.env
          export ARGUS_COMPOSE="docker compose -f docker-compose.prod.yml --env-file prod.env"
          $ARGUS_COMPOSE up -d
          $ARGUS_COMPOSE exec -T argus bash scripts/train_all.sh
          $ARGUS_COMPOSE restart argus
          bash scripts/prod_smoke.sh https://localhost:8443 operator "$PASSWORD"
          bash scripts/backup_volume.sh /tmp/argus-backup.tar.gz
          tar tzf /tmp/argus-backup.tar.gz > /dev/null
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --tail 100 argus
          docker compose -f docker-compose.prod.yml --env-file prod.env logs --tail 100
      - name: Clean up
        if: always()
        run: |
          docker compose down -v
          docker compose -f docker-compose.prod.yml --env-file prod.env down -v || true
