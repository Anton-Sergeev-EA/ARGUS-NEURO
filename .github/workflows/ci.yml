name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-core:
    name: Build & test C++ core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pybind11
        run: pip install pybind11
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR=$(python3 -m pybind11 --cmakedir)
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Run native unit tests
        run: ./build/cpp_core/argus_core_tests
      - uses: actions/upload-artifact@v4
        with:
          name: argus_core-extension
          path: build/cpp_core/argus_core*.so

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    needs: cpp-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: argus_core-extension
          path: build/cpp_core
      - name: Install Python dependencies
        run: pip install -r python/requirements.txt
      - name: Run tests (native core + NumPy fallback both exercised)
        run: |
          export PYTHONPATH="${PWD}/python:${PWD}/build/cpp_core"
          cd python && python -m pytest -v
