# Production-style deployment: TLS and a password in front, application not published.
#   cp .env.example .env   (fill it in; never commit it)
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# See docs/PRODUCTION.md for the limits of what this deployment has been validated for.
services:
  argus:
    build: .
    image: argus-neuro:local
    # Only the proxy reaches the application, so its forwarded headers can be trusted;
    # without them every client would share one rate-limit bucket.
    environment:
      UVICORN_PROXY_HEADERS: "true"
      UVICORN_FORWARDED_ALLOW_IPS: "*"
      ARGUS_INGEST_TOKEN: "${ARGUS_INGEST_TOKEN:-}"
    expose:
      - "8000"
    volumes:
      - argus-data:/app/artifacts
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"

  proxy:
    image: caddy:2.11.7-alpine
    depends_on:
      argus:
        condition: service_healthy
    ports:
      - "${ARGUS_HTTP_PORT:-80}:80"
      - "${ARGUS_HTTPS_PORT:-443}:443"
    environment:
      ARGUS_SITE: "${ARGUS_SITE:-localhost}"
      ARGUS_USER: "${ARGUS_USER:?set ARGUS_USER in .env}"
      ARGUS_PASSWORD_HASH: "${ARGUS_PASSWORD_HASH:?set ARGUS_PASSWORD_HASH in .env}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *log

volumes:
  argus-data:
  caddy-data:
  caddy-config:
